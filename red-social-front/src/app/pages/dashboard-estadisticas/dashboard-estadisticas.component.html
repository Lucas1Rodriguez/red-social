<app-navbar />

<div class="container py-4">
  <h3 class="mb-3">Estadísticas</h3>

  <div class="card shadow-sm mb-4">
    <div class="card-body d-flex flex-wrap align-items-end gap-3">
      <div>
        <label class="form-label mb-1">Desde</label>
        <input type="date" class="form-control" [value]="desde()"
               (change)="desde.set($any($event.target).value)">
      </div>
      <div>
        <label class="form-label mb-1">Hasta</label>
        <input type="date" class="form-control" [value]="hasta()"
               (change)="hasta.set($any($event.target).value)">
      </div>
      <button class="btn btn-primary" (click)="cargar()" [disabled]="cargando()">
        {{ cargando() ? 'Cargando...' : 'Aplicar' }}
      </button>

      <div class="ms-md-auto d-flex gap-2">
        <button class="btn btn-outline-primary btn-sm rounded-pill" (click)="rapido(7)">7 días</button>
        <button class="btn btn-outline-primary btn-sm rounded-pill" (click)="rapido(30)">30 días</button>
        <button class="btn btn-outline-primary btn-sm rounded-pill" (click)="rapido(90)">90 días</button>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-baseline">
            <h5 class="mb-3">Comentarios por día</h5>
            <span class="text-muted">Total: <strong>{{ totalComentarios() }}</strong></span>
          </div>
          <div class="position-relative" style="height: 300px;">
            <canvas #linea></canvas>
            @if (vacioLinea()) {
              <div class="position-absolute top-50 start-50 translate-middle text-muted">Sin datos en este período</div>
            }
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="mb-3">Publicaciones por usuario</h5>
          <div class="position-relative" style="height: 340px;">
            <canvas #torta></canvas>
            @if (vacioTorta()) {
              <div class="position-absolute top-50 start-50 translate-middle text-muted">Sin datos en este período</div>
            }
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="mb-3">Comentarios por publicación <small class="text-muted">(top 10)</small></h5>
          <div class="position-relative" style="height: 340px;">
            <canvas #barras></canvas>
            @if (vacioBarras()) {
              <div class="position-absolute top-50 start-50 translate-middle text-muted">Sin datos en este período</div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
