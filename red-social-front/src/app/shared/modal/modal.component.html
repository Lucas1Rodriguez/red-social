@if (modalService.modal(); as m) {
  <div class="modal-backdrop fade show"></div>
  <div class="modal d-block" tabindex="-1" (click)="modalService.cerrar()">
    <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header"
             [class.bg-success]="m.tipo === 'exito'"
             [class.bg-danger]="m.tipo === 'error'"
             [class.bg-info]="m.tipo === 'info'">
          <h5 class="modal-title text-white">{{ m.titulo }}</h5>
        </div>
        <div class="modal-body">
          @for (msg of m.mensajes; track $index) {
            <p class="mb-1">{{ msg }}</p>
          }
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" (click)="modalService.cerrar()">Aceptar</button>
        </div>
      </div>
    </div>
  </div>
}
